<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smotrim.ru</title>
  <style>
    :root {
      --bg-dark: #0f0e17;
      --purple: #7f5af0;
      --blue-dark: #1e3a8a;
      --white: #fffffe;
      --gray: #94a3b8;
      --card: #1a1826;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: radial-gradient(ellipse at top, #1e1b4b, #0f0e17 60%);
      color: var(--white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 300px; height: 300px;
      background: var(--purple);
      opacity: 0.2;
      filter: blur(100px);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .bg-glow:nth-child(1) { top: -100px; left: -80px; }
    .bg-glow:nth-child(2) { bottom: -100px; right: -80px; background: #2563eb; animation-delay: -4s; }
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 40px) scale(1.2); }
    }

    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      background: rgba(15,14,23,0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(127,90,240,0.3);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    .container { flex: 1; overflow-y: auto; padding: 20px; z-index: 5; }
    .bottom-nav {
      background: rgba(15,14,23,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 10px;
      border-top: 1px solid rgba(127,90,240,0.3);
      z-index: 10;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--gray);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--purple); }
    .create-room-btn {
      background: linear-gradient(135deg, #3b82f6, #7f5af0);
      border: none;
      width: 56px; height: 56px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59,130,246,0.6);
      transform: translateY(-10px);
      transition: all 0.2s;
      cursor: pointer;
    }
    .create-room-btn:active { transform: scale(0.95) translateY(-10px); }
    .create-room-btn span { font-size: 28px; color: white; }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(127,90,240,0.2);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .btn {
      background: var(--purple);
      border: none;
      border-radius: 14px;
      padding: 12px 24px;
      font-weight: 600;
      color: white;
      transition: all 0.2s;
      cursor: pointer;
      width: 100%;
    }
    .btn:active { transform: scale(0.97); background: #6d4bd1; }
    .input {
      background: #2d2a3d;
      border: 1px solid rgba(127,90,240,0.3);
      border-radius: 14px;
      padding: 12px;
      color: white;
      width: 100%;
      margin: 8px 0;
    }
    video { width: 100%; border-radius: 16px; background: black; }
    .chat-msg { background: #2d2a3d; padding: 10px; border-radius: 12px; margin: 4px 0; }
    .muted { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow"></div>

  <header>
    <span>🍿 Smotrim.ru</span>
    <span id="room-info" style="font-size:14px;color:#94a3b8;"></span>
  </header>

  <div class="container" id="app">
    <div id="menu-section" style="display:block;">
      <h2 style="margin-bottom:20px;">Мои комнаты</h2>
      <div id="rooms-list"></div>
    </div>
    <div id="room-section" style="display:none;">
      <video id="player" controls muted autoplay></video>
      <div id="chat-box" style="max-height:200px;overflow-y:auto;margin-top:10px;"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" class="input" id="chat-input" placeholder="Сообщение..." style="flex:1;">
        <button class="btn" id="send-msg" style="width:auto;">➤</button>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn" id="invite-btn">📋 Копировать ссылку</button>
        <button class="btn" id="leave-btn" style="background:#dc2626;">Выйти</button>
      </div>
    </div>
    <div id="settings-section" style="display:none;">
      <h2>Настройки</h2>
      <div class="card">Тёмная тема всегда</div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-tab="menu">🏠 Главная</button>
    <button class="nav-btn" data-tab="settings">⚙️ Настройки</button>
    <button class="create-room-btn" id="create-room-nav">＋</button>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const API = 'https://ТВОЙ-СЕРВЕР.pythonanywhere.com'; // ЗАМЕНИ НА СВОЙ
    const tg = window.Telegram.WebApp;
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('id');
    const isOwner = params.get('owner') === '1';

    let currentSection = 'menu';
    let myUserId = null;
    let currentRoom = null;
    let pollInterval = null;

    tg.ready();

    async function initUser() {
      const initData = tg.initData || '';
      try {
        const resp = await fetch(`${API}/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData })
        });
        const data = await resp.json();
        myUserId = data.user_id;
        if (roomId) joinRoom(roomId);
        else loadRooms();
      } catch(e) { console.error(e); }
    }

    async function loadRooms() {
      const resp = await fetch(`${API}/rooms?user_id=${myUserId}`);
      const rooms = await resp.json();
      const list = document.getElementById('rooms-list');
      if (!rooms.length) list.innerHTML = '<p>Нет активных комнат</p>';
      else list.innerHTML = rooms.map(r => `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <b>${r.title || 'Комната'}</b><br>
            <small>${r.owner_name} · 👥 ${r.users_count}/${r.max_users}</small>
          </div>
          <button class="btn" style="width:auto;" onclick="joinRoom('${r.id}')">Войти</button>
        </div>
      `).join('');
    }

    async function joinRoom(id) {
      const resp = await fetch(`${API}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room_id: id, user_id: myUserId, is_premium: false })
      });
      const data = await resp.json();
      if (data.error) { alert(data.error); return; }
      currentRoom = data.room;
      showSection('room');
      initRoomPolling();
    }

    async function leaveRoom() {
      if (!currentRoom) return;
      await fetch(`${API}/leave`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room_id: currentRoom.id, user_id: myUserId })
      });
      currentRoom = null;
      clearInterval(pollInterval);
      showSection('menu');
      loadRooms();
    }

    async function createRoom() {
      const videoUrl = prompt('Вставь прямую ссылку на видео (mp4):');
      if (!videoUrl) return;
      const resp = await fetch(`${API}/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_url: videoUrl, owner_id: myUserId, owner_name: tg.initDataUnsafe?.user?.first_name || 'Хозяин' })
      });
      const data = await resp.json();
      currentRoom = data.room;
      showSection('room');
      initRoomPolling();
    }

    function showSection(section) {
      ['menu','room','settings'].forEach(s => document.getElementById(`${s}-section`).style.display = 'none');
      document.getElementById(`${section}-section`).style.display = 'block';
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (section === 'menu') document.querySelector('[data-tab="menu"]').classList.add('active');
      if (section === 'settings') document.querySelector('[data-tab="settings"]').classList.add('active');
    }

    function initRoomPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!currentRoom) return;
        const resp = await fetch(`${API}/room_state?id=${currentRoom.id}`);
        const state = await resp.json();
        updatePlayer(state);
        updateChat(state.chat);
        document.getElementById('room-info').innerText = `👥 ${state.users_count}/${state.max_users}`;
      }, 1000);
    }

    function updatePlayer(state) {
      const video = document.getElementById('player');
      if (!state.video_url) return;
      if (video.src !== state.video_url) video.src = state.video_url;
      if (state.paused && !video.paused) video.pause();
      if (!state.paused && video.paused) video.play().catch(()=>{});
      if (Math.abs(video.currentTime - state.current_time) > 0.5) video.currentTime = state.current_time;
      if (isOwner) {
        video.onpause = () => sendPlayerState(true);
        video.onplay = () => sendPlayerState(false);
        video.onseeked = () => sendPlayerState(video.paused);
      } else {
        video.onpause = video.onplay = video.onseeked = null;
      }
    }

    async function sendPlayerState(paused) {
      if (!isOwner || !currentRoom) return;
      const video = document.getElementById('player');
      await fetch(`${API}/player`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          room_id: currentRoom.id,
          user_id: myUserId,
          paused,
          current_time: video.currentTime
        })
      });
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentRoom) return;
      const resp = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room_id: currentRoom.id, user_id: myUserId, text })
      });
      const data = await resp.json();
      if (data.error) alert(data.error);
      input.value = '';
    }

    function updateChat(messages) {
      const box = document.getElementById('chat-box');
      if (!messages) return;
      box.innerHTML = messages.map(m => `
        <div class="chat-msg ${m.muted ? 'muted' : ''}">
          <b>${m.user_name}:</b> ${m.text}
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('invite-btn')?.addEventListener('click', () => {
      if (!currentRoom) return;
      const link = `https://t.me/ТВОЙ_БОТ?start=room_${currentRoom.id}`;
      navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована!'));
    });

    document.getElementById('create-room-nav')?.addEventListener('click', createRoom);
    document.getElementById('send-msg')?.addEventListener('click', sendMessage);
    document.getElementById('leave-btn')?.addEventListener('click', leaveRoom);
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => showSection(btn.dataset.tab));
    });

    initUser();
  </script>
</body>
</html>
