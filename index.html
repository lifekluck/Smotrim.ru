<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smotrim.ru</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1e;
      --primary: #8b5cf6;
      --text: #ffffff;
      --text-secondary: #a1a1aa;
      --border: rgba(139, 92, 246, 0.2);
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    body.light {
      --bg: #ffffff;
      --surface: #f4f4f5;
      --primary: #7c3aed;
      --text: #18181b;
      --text-secondary: #52525b;
      --border: rgba(124, 58, 237, 0.15);
      --shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    #blob-canvas {
      position: absolute;
      top:0; left:0; width:100%; height:100%;
      pointer-events: none;
      z-index: 0;
    }
    header {
      backdrop-filter: blur(12px);
      background: var(--surface);
      padding: 16px 20px;
      font-size: 22px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .container { flex:1; overflow-y:auto; padding:20px; position:relative; z-index:5; }
    .bottom-nav {
      position: relative;
      backdrop-filter: blur(16px);
      background: var(--surface);
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 12px 10px 8px;
      border-top: 1px solid var(--border);
      z-index: 10;
      height: 72px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      cursor: pointer;
      flex: 1;
    }
    .nav-btn.active { color: var(--primary); }
    .create-room-btn {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      box-shadow: 0 8px 28px rgba(139,92,246,0.6);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 20;
    }
    .create-room-btn:active {
      transform: translateX(-50%) scale(0.93);
      box-shadow: 0 4px 16px rgba(139,92,246,0.8);
    }
    .create-room-btn span { font-size: 32px; color: white; line-height: 1; }

    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .btn {
      background: var(--primary);
      border: none;
      border-radius: 16px;
      padding: 14px 24px;
      font-weight: 600;
      color: white;
      transition: all 0.2s;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }
    .btn-small {
      padding: 10px 18px;
      font-size: 14px;
    }
    .input {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      color: var(--text);
      width: 100%;
      margin: 8px 0;
      font-size: 16px;
    }
    video, iframe {
      width: 100%;
      border-radius: 20px;
      background: black;
      aspect-ratio: 16/9;
    }
    .chat-msg {
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 16px;
      margin: 6px 0;
      font-size: 15px;
    }
    .muted { opacity: 0.4; }
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0;
    }
    .toggle {
      width: 52px; height: 28px;
      background: #3f3f46;
      border-radius: 28px;
      position: relative;
      transition: background 0.3s;
      cursor: pointer;
    }
    .toggle.active { background: var(--primary); }
    .toggle::after {
      content: '';
      width: 24px; height: 24px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px; left: 2px;
      transition: left 0.3s;
    }
    .toggle.active::after { left: 26px; }

    /* Модалка */
    .modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--surface);
      padding: 24px;
      border-radius: 28px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    .participant-list {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .participant {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
  </style>
</head>

  <script>
    const API = 'https://lifekluck.pythonanywhere.com';
    const tg = window.Telegram.WebApp;
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('id');
    const isOwner = params.get('owner') === '1';

    let myUserId = null;
    let currentRoom = null;
    let pollInterval = null;
    let youtubePlayer = null;
    let playerType = 'mp4';

    tg.ready();

    // ========== Инициализация ==========
    async function initUser() {
      try {
        const resp = await fetch(`${API}/validate`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({initData: tg.initData || ''})
        });
        const data = await resp.json();
        myUserId = data.user_id;
        if (roomId) joinRoom(roomId);
        else loadRooms();
      } catch(e) { console.error(e); }
    }

    async function loadRooms() {
      const resp = await fetch(`${API}/rooms?user_id=${myUserId}`);
      const rooms = await resp.json();
      const list = document.getElementById('rooms-list');
      if (!rooms.length) list.innerHTML = '<p style="color:var(--text-secondary);">Нет активных комнат</p>';
      else list.innerHTML = rooms.map(r => {
        const isPub = r.is_public ? '🌐 Публичная' : '🔒 Приватная';
        return `
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <b>${r.owner_name || 'Комната'}</b><br>
              <small style="color:var(--text-secondary);">${isPub} · 👥 ${Object.keys(r.users).length}/${r.max_users}</small>
            </div>
            <button class="btn btn-small" style="width:auto;" onclick="joinRoom('${r.id}')">Войти</button>
          </div>
        `;
      }).join('');
    }

    // ========== Управление комнатами ==========
    async function createRoom() {
      const url = document.getElementById('video-url-input').value.trim();
      if (!url) { alert('Введи ссылку на видео'); return; }
      const isPublic = document.getElementById('public-toggle').classList.contains('active');
      const resp = await fetch(`${API}/create`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          video_url: url,
          owner_id: myUserId,
          owner_name: tg.initDataUnsafe?.user?.first_name || 'Хозяин',
          is_public: isPublic
        })
      });
      const data = await resp.json();
      currentRoom = data.room;
      closeCreateModal();
      showSection('room');
      setupPlayer(currentRoom.video_url);
      initRoomPolling();
    }

    async function joinRoom(id) {
      const resp = await fetch(`${API}/join`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: id, user_id: myUserId})
      });
      const data = await resp.json();
      if (data.error) { alert(data.error); return; }
      currentRoom = data.room;
      showSection('room');
      setupPlayer(currentRoom.video_url);
      initRoomPolling();
    }

    async function deleteRoom() {
      if (!currentRoom || !confirm('Удалить комнату безвозвратно?')) return;
      await fetch(`${API}/delete_room`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId})
      });
      currentRoom = null; clearInterval(pollInterval);
      showSection('menu'); loadRooms();
    }

    // ========== Плеер ==========
    function setupPlayer(url) {
      document.getElementById('player').style.display = 'none';
      document.getElementById('youtube-player').style.display = 'none';
      if (youtubePlayer) { youtubePlayer.destroy(); youtubePlayer = null; }

      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        playerType = 'youtube';
        const videoId = extractYouTubeId(url);
        if (videoId) {
          document.getElementById('youtube-player').style.display = 'block';
          youtubePlayer = new YT.Player('youtube-player', {
            videoId: videoId,
            playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0 },
            events: { onReady: () => { if (isOwner) youtubePlayer.playVideo(); } }
          });
        }
      } else {
        playerType = 'mp4';
        const player = document.getElementById('player');
        player.style.display = 'block';
        player.src = url;
        player.load();
        if (isOwner) {
          player.onpause = () => sendPlayerState(true);
          player.onplay = () => sendPlayerState(false);
          player.onseeked = () => sendPlayerState(player.paused);
        }
      }
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function sendPlayerState(paused) {
      if (!isOwner || !currentRoom) return;
      let currentTime = 0;
      if (playerType === 'youtube' && youtubePlayer) {
        currentTime = youtubePlayer.getCurrentTime();
      } else {
        currentTime = document.getElementById('player').currentTime;
      }
      await fetch(`${API}/player`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId, paused, current_time: currentTime})
      });
    }

    function initRoomPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!currentRoom) return;
        const resp = await fetch(`${API}/room_state?id=${currentRoom.id}`);
        const state = await resp.json();
        if (state.error) { alert('Комната была удалена'); leaveRoom(); return; }
        document.getElementById('room-info').innerText = `👥 ${Object.keys(state.users).length}/${state.max_users}`;
        updatePlayer(state);
        updateChat(state.chat);
        updateParticipants(state.users);
        // Показываем кнопку удаления только владельцу
        document.getElementById('delete-room-btn').style.display = (state.owner_id === myUserId) ? 'block' : 'none';
      }, 1000);
    }

    function updatePlayer(state) {
      if (!state.video_url) return;
      if (playerType === 'mp4') {
        const video = document.getElementById('player');
        if (video.src !== state.video_url) video.src = state.video_url;
        if (state.paused && !video.paused) video.pause();
        if (!state.paused && video.paused) video.play().catch(()=>{});
        if (Math.abs(video.currentTime - state.current_time) > 0.5) video.currentTime = state.current_time;
      } else if (playerType === 'youtube' && youtubePlayer) {
        if (state.paused && youtubePlayer.getPlayerState() === 1) youtubePlayer.pauseVideo();
        if (!state.paused && youtubePlayer.getPlayerState() === 2) youtubePlayer.playVideo();
        if (Math.abs(youtubePlayer.getCurrentTime() - state.current_time) > 1.5)
          youtubePlayer.seekTo(state.current_time, true);
      }
    }

    function updateChat(messages) {
      const box = document.getElementById('chat-box');
      if (!messages) return;
      box.innerHTML = messages.map(m => `
        <div class="chat-msg ${m.muted ? 'muted' : ''}">
          <b>${m.user_name}:</b> ${m.text}
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    function updateParticipants(users) {
      const panel = document.getElementById('participants-panel');
      if (!users) return;
      const names = Object.values(users).map(u => u.name);
      panel.innerHTML = names.map(n => `<span class="participant">${n}</span>`).join('');
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentRoom) return;
      const resp = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId, text})
      });
      const data = await resp.json();
      if (data.error) alert(data.error);
      input.value = '';
    }

    async function leaveRoom() {
      if (!currentRoom) return;
      await fetch(`${API}/leave`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId})
      });
      currentRoom = null; clearInterval(pollInterval);
      showSection('menu'); loadRooms();
    }

    .create-room-btn {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      box-shadow: 0 8px 28px rgba(139,92,246,0.6);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 20;
    }
    .create-room-btn:active {
      transform: translateX(-50%) scale(0.93);
      box-shadow: 0 4px 16px rgba(139,92,246,0.8);
    }
    .create-room-btn span { font-size: 32px; color: white; line-height: 1; }

    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .btn {
      background: var(--primary);
      border: none;
      border-radius: 16px;
      padding: 14px 24px;
      font-weight: 600;
      color: white;
      transition: all 0.2s;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }
    .btn-small {
      padding: 10px 18px;
      font-size: 14px;
    }
    .input {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      color: var(--text);
      width: 100%;
      margin: 8px 0;
      font-size: 16px;
    }
    video, iframe {
      width: 100%;
      border-radius: 20px;
      background: black;
      aspect-ratio: 16/9;
    }
    .chat-msg {
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 16px;
      margin: 6px 0;
      font-size: 15px;
    }
    .muted { opacity: 0.4; }
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0;
    }
    .toggle {
      width: 52px; height: 28px;
      background: #3f3f46;
      border-radius: 28px;
      position: relative;
      transition: background 0.3s;
      cursor: pointer;
    }
    .toggle.active { background: var(--primary); }
    .toggle::after {
      content: '';
      width: 24px; height: 24px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px; left: 2px;
      transition: left 0.3s;
    }
    .toggle.active::after { left: 26px; }

    /* Модалка */
    .modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--surface);
      padding: 24px;
      border-radius: 28px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    .participant-list {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .participant {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body class="dark">
  <canvas id="blob-canvas"></canvas>

  <header>
    <span style="display:flex;align-items:center;gap:10px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      Smotrim.ru
    </span>
    <span id="room-info" style="font-size:14px;color:var(--text-secondary);"></span>
  </header>

  <div class="container" id="app">
    <!-- Меню -->
    <div id="menu-section" style="display:block;">
      <h2 style="margin-bottom:24px;">Комнаты</h2>
      <div id="rooms-list"></div>
    </div>

    <!-- Комната просмотра -->
    <div id="room-section" style="display:none;">
      <div id="player-container" style="position:relative;margin-bottom:12px;">
        <video id="player" style="display:none;" controls playsinline></video>
        <iframe id="youtube-player" style="display:none;" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <button class="btn btn-small" id="show-participants" style="width:auto;">👥 Участники</button>
        <button class="btn btn-small" id="delete-room-btn" style="width:auto; background:#dc2626; display:none;">🗑 Удалить</button>
      </div>
      <div id="participants-panel" style="display:none; margin-bottom:12px;" class="participant-list"></div>
      <div id="chat-box" style="max-height:180px;overflow-y:auto;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="text" class="input" id="chat-input" placeholder="Сообщение..." style="flex:1;">
        <button class="btn" id="send-msg" style="width:auto;padding:14px 18px;">➤</button>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="invite-btn" style="flex:1;">📋 Копировать ссылку</button>
        <button class="btn" id="leave-btn" style="flex:1;background:#dc2626;">Выйти</button>
      </div>
    </div>

    <!-- Настройки -->
    <div id="settings-section" style="display:none;">
      <h2 style="margin-bottom:24px;">Настройки</h2>
      <div class="card">
        <div class="setting-row">
          <span>Тёмная тема</span>
          <div class="toggle active" id="theme-toggle" onclick="toggleTheme()"></div>
        </div>
        <div class="setting-row">
          <span>Анимация фона</span>
          <div class="toggle active" id="anim-toggle" onclick="toggleAnimation()"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Нижняя панель -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-tab="menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Главная
    </button>
    <button class="nav-btn" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Настройки
    </button>
    <button class="create-room-btn" id="create-room-nav">＋</button>
  </div>

  <!-- Модальное окно для кнопки + -->
  <div id="plus-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">Выберите действие</h3>
      <button class="btn" id="create-room-modal-btn" style="margin-bottom:12px;">🎬 Создать комнату</button>
      <button class="btn" id="join-room-modal-btn" style="background:#6366f1;">🔗 Войти в комнату</button>
      <button class="btn" id="close-plus-modal" style="background:transparent; color:var(--text-secondary); margin-top:8px;">Отмена</button>
    </div>
  </div>

  <!-- Модальное окно создания комнаты -->
  <div id="create-room-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">Создание комнаты</h3>
      <input type="text" class="input" id="video-url-input" placeholder="Ссылка на видео (mp4 / YouTube)">
      <div class="setting-row">
        <span>Публичная комната</span>
        <div class="toggle active" id="public-toggle" onclick="this.classList.toggle('active')"></div>
      </div>
      <button class="btn" id="confirm-create-room" style="margin-top:12px;">Создать</button>
      <button class="btn" id="close-create-modal" style="background:transparent; color:var(--text-secondary); margin-top:8px;">Отмена</button>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const API = 'https://lifekluck.pythonanywhere.com';
    const tg = window.Telegram.WebApp;
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('id');
    const isOwner = params.get('owner') === '1';

    let myUserId = null;
    let currentRoom = null;
    let pollInterval = null;
    let youtubePlayer = null;
    let playerType = 'mp4';

    tg.ready();

    // ========== Инициализация ==========
    async function initUser() {
      try {
        const resp = await fetch(`${API}/validate`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({initData: tg.initData || ''})
        });
        const data = await resp.json();
        myUserId = data.user_id;
        if (roomId) joinRoom(roomId);
        else loadRooms();
      } catch(e) { console.error(e); }
    }

    async function loadRooms() {
      const resp = await fetch(`${API}/rooms?user_id=${myUserId}`);
      const rooms = await resp.json();
      const list = document.getElementById('rooms-list');
      if (!rooms.length) list.innerHTML = '<p style="color:var(--text-secondary);">Нет активных комнат</p>';
      else list.innerHTML = rooms.map(r => {
        const isPub = r.is_public ? '🌐 Публичная' : '🔒 Приватная';
        return `
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <b>${r.owner_name || 'Комната'}</b><br>
              <small style="color:var(--text-secondary);">${isPub} · 👥 ${Object.keys(r.users).length}/${r.max_users}</small>
            </div>
            <button class="btn btn-small" style="width:auto;" onclick="joinRoom('${r.id}')">Войти</button>
          </div>
        `;
      }).join('');
    }

    // ========== Управление комнатами ==========
    async function createRoom() {
      const url = document.getElementById('video-url-input').value.trim();
      if (!url) { alert('Введи ссылку на видео'); return; }
      const isPublic = document.getElementById('public-toggle').classList.contains('active');
      const resp = await fetch(`${API}/create`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          video_url: url,
          owner_id: myUserId,
          owner_name: tg.initDataUnsafe?.user?.first_name || 'Хозяин',
          is_public: isPublic
        })
      });
      const data = await resp.json();
      currentRoom = data.room;
      closeCreateModal();
      showSection('room');
      setupPlayer(currentRoom.video_url);
      initRoomPolling();
    }

    async function joinRoom(id) {
      const resp = await fetch(`${API}/join`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: id, user_id: myUserId})
      });
      const data = await resp.json();
      if (data.error) { alert(data.error); return; }
      currentRoom = data.room;
      showSection('room');
      setupPlayer(currentRoom.video_url);
      initRoomPolling();
    }

    async function deleteRoom() {
      if (!currentRoom || !confirm('Удалить комнату безвозвратно?')) return;
      await fetch(`${API}/delete_room`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId})
      });
      currentRoom = null; clearInterval(pollInterval);
      showSection('menu'); loadRooms();
    }

    // ========== Плеер ==========
    function setupPlayer(url) {
      document.getElementById('player').style.display = 'none';
      document.getElementById('youtube-player').style.display = 'none';
      if (youtubePlayer) { youtubePlayer.destroy(); youtubePlayer = null; }

      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        playerType = 'youtube';
        const videoId = extractYouTubeId(url);
        if (videoId) {
          document.getElementById('youtube-player').style.display = 'block';
          youtubePlayer = new YT.Player('youtube-player', {
            videoId: videoId,
            playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0 },
            events: { onReady: () => { if (isOwner) youtubePlayer.playVideo(); } }
          });
        }
      } else {
        playerType = 'mp4';
        const player = document.getElementById('player');
        player.style.display = 'block';
        player.src = url;
        player.load();
        if (isOwner) {
          player.onpause = () => sendPlayerState(true);
          player.onplay = () => sendPlayerState(false);
          player.onseeked = () => sendPlayerState(player.paused);
        }
      }
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function sendPlayerState(paused) {
      if (!isOwner || !currentRoom) return;
      let currentTime = 0;
      if (playerType === 'youtube' && youtubePlayer) {
        currentTime = youtubePlayer.getCurrentTime();
      } else {
        currentTime = document.getElementById('player').currentTime;
      }
      await fetch(`${API}/player`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId, paused, current_time: currentTime})
      });
    }

    function initRoomPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!currentRoom) return;
        const resp = await fetch(`${API}/room_state?id=${currentRoom.id}`);
        const state = await resp.json();
        if (state.error) { alert('Комната была удалена'); leaveRoom(); return; }
        document.getElementById('room-info').innerText = `👥 ${Object.keys(state.users).length}/${state.max_users}`;
        updatePlayer(state);
        updateChat(state.chat);
        updateParticipants(state.users);
        // Показываем кнопку удаления только владельцу
        document.getElementById('delete-room-btn').style.display = (state.owner_id === myUserId) ? 'block' : 'none';
      }, 1000);
    }

    function updatePlayer(state) {
      if (!state.video_url) return;
      if (playerType === 'mp4') {
        const video = document.getElementById('player');
        if (video.src !== state.video_url) video.src = state.video_url;
        if (state.paused && !video.paused) video.pause();
        if (!state.paused && video.paused) video.play().catch(()=>{});
        if (Math.abs(video.currentTime - state.current_time) > 0.5) video.currentTime = state.current_time;
      } else if (playerType === 'youtube' && youtubePlayer) {
        if (state.paused && youtubePlayer.getPlayerState() === 1) youtubePlayer.pauseVideo();
        if (!state.paused && youtubePlayer.getPlayerState() === 2) youtubePlayer.playVideo();
        if (Math.abs(youtubePlayer.getCurrentTime() - state.current_time) > 1.5)
          youtubePlayer.seekTo(state.current_time, true);
      }
    }

    function updateChat(messages) {
      const box = document.getElementById('chat-box');
      if (!messages) return;
      box.innerHTML = messages.map(m => `
        <div class="chat-msg ${m.muted ? 'muted' : ''}">
          <b>${m.user_name}:</b> ${m.text}
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    function updateParticipants(users) {
      const panel = document.getElementById('participants-panel');
      if (!users) return;
      const names = Object.values(users).map(u => u.name);
      panel.innerHTML = names.map(n => `<span class="participant">${n}</span>`).join('');
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentRoom) return;
      const resp = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId, text})
      });
      const data = await resp.json();
      if (data.error) alert(data.error);
      input.value = '';
    }

    async function leaveRoom() {
      if (!currentRoom) return;
      await fetch(`${API}/leave`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({room_id: currentRoom.id, user_id: myUserId})
      });
      currentRoom = null; clearInterval(pollInterval);
      showSection('menu'); loadRooms();
    }

    // ========== UI ==========
    function showSection(section) {
      ['menu','room','settings'].forEach(s => document.getElementById(`${s}-section`).style.display = 'none');
      document.getElementById(`${section}-section`).style.display = 'block';
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (section === 'menu') document.querySelector('[data-tab="menu"]').classList.add('active');
      if (section === 'settings') document.querySelector('[data-tab="settings"]').classList.add('active');
    }

    // Модалки для +
    document.getElementById('create-room-nav').addEventListener('click', () => {
      document.getElementById('plus-modal').style.display = 'flex';
    });
    document.getElementById('close-plus-modal').addEventListener('click', () => {
      document.getElementById('plus-modal').style.display = 'none';
    });
    document.getElementById('create-room-modal-btn').addEventListener('click', () => {
      document.getElementById('plus-modal').style.display = 'none';
      document.getElementById('create-room-modal').style.display = 'flex';
    });
    document.getElementById('join-room-modal-btn').addEventListener('click', () => {
      document.getElementById('plus-modal').style.display = 'none';
      const id = prompt('Введите ID комнаты или полную ссылку:');
      if (id) {
        // Извлекаем ID из ссылки, если передан URL
        const match = id.match(/room_(\d+)/);
        const roomId = match ? match[1] : id;
        joinRoom(roomId);
      }
    });
    document.getElementById('close-create-modal').addEventListener('click', () => {
      document.getElementById('create-room-modal').style.display = 'none';
    });
    document.getElementById('confirm-create-room').addEventListener('click', createRoom);

    // Участники
    document.getElementById('show-participants').addEventListener('click', () => {
      const panel = document.getElementById('participants-panel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    });

    // Удаление комнаты
    document.getElementById('delete-room-btn').addEventListener('click', deleteRoom);

    // Копировать ссылку
    document.getElementById('invite-btn').addEventListener('click', () => {
      if (!currentRoom) return;
      const link = `https://t.me/smotrimrubot?start=room_${currentRoom.id}`;
      navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована!'));
    });

    document.getElementById('send-msg').addEventListener('click', sendMessage);
    document.getElementById('leave-btn').addEventListener('click', leaveRoom);

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => showSection(btn.dataset.tab));
    });

    // Темы и анимация
    function toggleTheme() {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      document.getElementById('theme-toggle').classList.toggle('active', !isLight);
    }
    function toggleAnimation() {
      const canvas = document.getElementById('blob-canvas');
      canvas.style.display = canvas.style.display === 'none' ? 'block' : 'none';
      document.getElementById('anim-toggle').classList.toggle('active');
    }
    window.toggleTheme = toggleTheme;
    window.toggleAnimation = toggleAnimation;

    // ========== Фон: плавающие овалы ==========
    const canvas = document.getElementById('blob-canvas');
    const ctx = canvas.getContext('2d');
    let blobs = [];
    let animationId;
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Blob {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.rx = 50 + Math.random() * 120;
        this.ry = 30 + Math.random() * 80;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.hue = Math.random() * 60 + 250; // фиолетово-синий диапазон
        this.alpha = 0.1 + Math.random() * 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw(ctx) {
        ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.alpha})`;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.rx, this.ry, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function initBlobs(count=10) {
      blobs = [];
      for (let i=0; i<count; i++) blobs.push(new Blob());
    }
    function animate() {
      if (canvas.style.display === 'none') { animationId = requestAnimationFrame(animate); return; }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      blobs.forEach(b => { b.update(); b.draw(ctx); });
      animationId = requestAnimationFrame(animate);
    }
    initBlobs();
    animate();

    initUser();
  </script>
</body>
</html>
